name: waitless
description: "Real-Time Crowd Intelligence & Time Optimization Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Firebase
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.12
  firebase_messaging: ^15.2.3
  firebase_analytics: ^11.4.3
  
  # Maps & Location
  # mapbox_maps_flutter: ^2.6.0  # Configure later
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  
  # UI Components
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  share_plus: ^10.1.4
  
  # Navigation
  go_router: ^15.1.2
  
  # Local Storage
  shared_preferences: ^2.5.3
  hive_flutter: ^1.1.0
  
  # Utilities
  intl: ^0.20.2
  timeago: ^3.7.0
  uuid: ^4.5.1
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  freezed_annotation: ^3.0.0
  
  # Ads (commented out until configured)
  # google_mobile_ads: ^5.3.1
  
  # Networking
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4
  
  # Sensors & Device
  sensors_plus: ^6.1.1
  device_info_plus: ^11.4.0
  package_info_plus: ^8.3.0
  
  # Permissions
  permission_handler: ^11.4.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  
  # AI Integration
  google_generative_ai: ^0.4.6
  
  # Game Engine
  flame: ^1.22.0
  flame_audio: ^2.11.0
  
  # Enhanced UI
  flutter_staggered_grid_view: ^0.7.0
  animated_text_kit: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.5
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
